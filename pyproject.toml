[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ant-rl"
version = "0.1.0"
description = "Ant reinforcement learning project with Isaac Lab"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "source"}

[tool.setuptools.packages.find]
where = ["source"]